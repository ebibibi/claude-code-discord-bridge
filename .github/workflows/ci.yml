name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 17 * * *'  # Daily at 02:00 JST (17:00 UTC)
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  test:
    runs-on: [self-hosted, linux, x64]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check claude_discord/

      - name: Format check
        run: uv run ruff format --check claude_discord/

      - name: Type check
        run: uv run pyright claude_discord/

      - name: Test
        run: uv run pytest tests/ -v --cov=claude_discord --cov-branch --cov-report=term-missing --cov-fail-under=75
        env:
          HOME: ${{ runner.temp }}/fakehome

  # The README claims macOS and Windows support. This job is what makes that
  # claim checkable: the package ships sys.platform branches (signal handling,
  # .cmd/.bat resolution) that no Linux run can exercise. Hosted runners, since
  # the self-hosted fleet is Linux-only; free for a public repository.
  cross-platform:
    runs-on: ${{ matrix.os }}
    # A hung test must fail, not sit for six hours on a hosted runner.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --dev

      # No coverage gate here — the Linux job owns that. This job answers one
      # question only: does the suite still pass off Linux?
      # Per-test timeout because the first Windows run hung: without it a
      # blocked test looks like a slow runner and reports nothing at all.
      # pytest-timeout kills the process on Windows, so a hang costs the rest of
      # the run — that is the trade for ever learning the hanging test's name.
      - name: Test
        run: uv run pytest tests/ -q --timeout=120 --timeout-method=thread
        env:
          HOME: ${{ runner.temp }}/fakehome
          USERPROFILE: ${{ runner.temp }}/fakehome

  notify-failure:
    needs: [test, cross-platform]
    if: failure()
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Post CI failure to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Security: untrusted user input must go through env vars, not inline ${{ }} expansion
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          REF="${{ github.ref_name }}"
          EVENT="${{ github.event_name }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT="${{ github.sha }}"
          SHORT_SHA="${COMMIT:0:7}"

          if [ "$EVENT" = "pull_request" ]; then
            CONTEXT="PR #${PR_NUMBER} \`${PR_TITLE}\`"
          else
            CONTEXT="push to \`${REF}\` (\`${SHORT_SHA}\`)"
          fi

          curl -s -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"❌ **CI failed** — ${CONTEXT}\n${RUN_URL}\"}" \
            "$DISCORD_WEBHOOK_URL"

  create-issue-on-schedule-failure:
    needs: [test]
    # Only create issues for scheduled runs (not PR/push — those are dev feedback loops)
    if: failure() && github.event_name == 'schedule'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7

      - name: Create auto-fix label if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh label create "auto-fix" \
            --color "e4e669" \
            --description "Targeted for auto-fix by issue_resolver" \
            --repo "${REPO}" 2>/dev/null || true

      - name: Create GitHub Issue for scheduled CI failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BODY=$(printf '## Scheduled CI Failure\n\nThe daily CI run failed on %s.\n\n**Workflow run:** %s\n\nPlease investigate the test failures and fix them. Check the linked workflow run for details.' "${DATE}" "${RUN_URL}")
          gh issue create \
            --title "CI failure on scheduled run (${DATE})" \
            --body "${BODY}" \
            --label "auto-fix" \
            --repo "${REPO}"
